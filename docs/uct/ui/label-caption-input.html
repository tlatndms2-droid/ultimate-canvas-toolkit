<div id="uct-label-caption-flow">
  <style>
    #uct-label-caption-flow { --ink:#272522;--muted:#77716a;--line:#e5e1dc;--paper:#fff;--soft:#faf9f7;--accent:#bd6248; color:var(--ink);font:14px/1.45 system-ui,'Malgun Gothic',sans-serif;max-width:736px;margin:auto; }
    #uct-label-caption-flow * { box-sizing:border-box; }
    #uct-label-caption-flow .actions { display:flex;gap:8px;flex-wrap:wrap;margin:0 90px 12px 0; }
    #uct-label-caption-flow button,#uct-label-caption-flow input,#uct-label-caption-flow select { font:inherit; }
    #uct-label-caption-flow button { color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:7px 10px; }
    #uct-label-caption-flow .window { border:1px solid var(--line);border-radius:10px;background:var(--paper);overflow:hidden; }
    #uct-label-caption-flow .window { position:relative; }
    #uct-label-caption-flow .top { padding:9px 13px;border-bottom:1px solid var(--line);font-weight:600; }
    #uct-label-caption-flow .columns { display:grid;grid-template-columns:minmax(0,1.55fr) minmax(190px,1fr); }
    #uct-label-caption-flow .canvas { min-width:0;padding:18px;background-color:var(--soft);background-image:radial-gradient(#e4e0dc 1px,transparent 1px);background-size:17px 17px; }
    #uct-label-caption-flow .node { max-width:380px;margin:0 auto; }
    #uct-label-caption-flow .label { min-height:30px;padding:0 0 6px;color:#96543f;font-weight:600; }
    #uct-label-caption-flow .card { background:#fff;border:1px solid #d9d4ce;border-radius:8px;padding:18px; }
    #uct-label-caption-flow h2 { font:22px/1.3 Georgia,'Malgun Gothic',serif;margin:0 0 9px; }
    #uct-label-caption-flow .body { color:#655f59;margin:0; }
    #uct-label-caption-flow .caption { min-height:55px;padding-top:8px;color:#655f59;white-space:pre-wrap; }
    #uct-label-caption-flow .plus { display:block;margin:0 auto;opacity:0; }
    #uct-label-caption-flow .node:hover .plus,#uct-label-caption-flow .node:focus-within .plus { opacity:1; }
    #uct-label-caption-flow .caption-edit,#uct-label-caption-flow .new-label { width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink); }
    #uct-label-caption-flow .modal-scrim { position:absolute;inset:39px 0 0;z-index:2;display:grid;place-items:center;padding:16px;background:#27252266; }
    #uct-label-caption-flow .modal-scrim[hidden],#uct-label-caption-flow .caption-edit[hidden],#uct-label-caption-flow .caption[hidden],#uct-label-caption-flow .plus[hidden] { display:none; }
    #uct-label-caption-flow .label-dialog { width:min(100%,390px);border:1px solid var(--line);background:#fff;border-radius:8px;padding:16px;box-shadow:0 5px 18px #2725221c; }
    #uct-label-caption-flow .label-dialog h3 { margin:0 0 8px;font-size:15px; }
    #uct-label-caption-flow .label-dialog label,#uct-label-caption-flow .outliner label { display:block;font-size:12px;color:var(--muted);margin:8px 0 4px; }
    #uct-label-caption-flow select { width:100%;padding:7px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink); }
    #uct-label-caption-flow .create { display:grid;grid-template-columns:minmax(0,1fr) 38px auto;gap:6px;margin-top:8px;align-items:center; }
    #uct-label-caption-flow input[type=color] { width:38px;height:36px;padding:2px;border:1px solid var(--line);border-radius:6px;background:#fff; }
    #uct-label-caption-flow .apply { margin-top:9px; }
    #uct-label-caption-flow .outliner { border-left:1px solid var(--line);padding:15px;min-width:0;background:#fff; }
    #uct-label-caption-flow .outliner h3 { margin:0 0 8px;font-size:16px; }
    #uct-label-caption-flow .search { width:100%;padding:7px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink); }
    #uct-label-caption-flow .row { padding:8px 5px;border-bottom:1px solid var(--line); }
    #uct-label-caption-flow .pill { display:inline-block;border-radius:20px;background:#f3e6df;color:#8c4935;padding:2px 8px;font-size:12px; }
    #uct-label-caption-flow .small { display:block;color:var(--muted);font-size:12px;margin-top:3px; }
    #uct-label-caption-flow .status { padding:10px 2px 0;color:var(--muted);min-height:40px; }
    #uct-label-caption-flow .hint { margin:7px 0 0;color:var(--muted);font-size:12px; }
    @media(max-width:600px){#uct-label-caption-flow .columns{grid-template-columns:1fr}#uct-label-caption-flow .outliner{border-left:0;border-top:1px solid var(--line)}#uct-label-caption-flow .plus{opacity:1}}
  </style>
  <div class="actions" aria-label="단축키 입력 시안 체험">
    <button type="button" class="cursor-interaction" data-action="label">Alt+L · 기존 라벨 창 열기</button>
    <button type="button" class="cursor-interaction" data-action="caption">Alt+C · 카드 아래 캡션 입력</button>
  </div>
  <div class="window">
    <div class="top">Canvas · 선택된 카드</div>
    <div class="columns">
      <section class="canvas" aria-label="Canvas 카드와 기존 라벨 편집 방식">
        <div class="node">
          <div class="label" aria-live="polite"></div>
          <div class="card"><h2>작업 공간 아이디어</h2><p class="body">창가의 자연광을 활용하고,<br>자주 쓰는 자료를 가까이 배치하기.</p></div>
          <div class="caption" aria-live="polite"></div>
          <button type="button" class="plus cursor-interaction" aria-label="카드 아래 캡션 추가">＋ 캡션 추가</button>
          <textarea class="caption-edit" aria-label="캡션 입력" placeholder="카드 아래에 캡션을 입력하세요" hidden></textarea>
          <div class="hint" data-caption-help hidden>Enter로 저장 · Esc로 취소</div>
        </div>
        <div class="status" role="status" aria-live="polite">라벨은 기존 선택·생성 창을 호출합니다. 캡션은 카드 아래에 추가됩니다.</div>
      </section>
      <aside class="outliner" aria-label="라벨 검색과 Outliner 확인">
        <h3>Outliner</h3>
        <input class="search" aria-label="Canvas 항목 검색" placeholder="Canvas에서 검색">
        <div class="row" data-result hidden><strong>작업 공간 아이디어</strong><span class="pill" data-pill hidden></span><span class="small" data-outliner-caption hidden></span></div>
        <p class="hint">라벨이 있는 카드는 현재 공간 목록에 자동 표시됩니다. 여기서는 확인만 하고, 수정은 Canvas에서 합니다.</p>
        <p class="hint">Canvas Search에 라벨도 포함됩니다.</p>
      </aside>
    </div>
    <div class="modal-scrim" hidden>
          <section class="label-dialog" role="dialog" aria-modal="true" aria-label="기존 라벨 선택 및 생성">
            <h3>기존 라벨 방식</h3>
            <label for="uct-label-choice">기존 라벨 선택</label>
            <select id="uct-label-choice"><option value="">라벨 없음</option><option>아이디어</option><option>참고 자료</option><option>프로젝트</option></select>
            <label for="uct-new-label">새 라벨 추가</label>
            <div class="create"><input class="new-label" id="uct-new-label" placeholder="새 라벨 이름"><input type="color" value="#bd6248" aria-label="라벨 색상"><button type="button" class="cursor-interaction" data-add>추가</button></div>
            <button type="button" class="apply cursor-interaction" data-apply>적용</button>
            <p class="hint">태그는 제거 대상이라 이 시안에 넣지 않았습니다.</p>
          </section>
  </div>
  </div>
  <script>
  (()=>{
    const root=document.getElementById('uct-label-caption-flow');
    const status=root.querySelector('.status'),scrim=root.querySelector('.modal-scrim'),dialog=root.querySelector('.label-dialog'),choice=root.querySelector('#uct-label-choice');
    const labelText=root.querySelector('.new-label'),labelColor=root.querySelector('input[type=color]');
    const captionInput=root.querySelector('.caption-edit'),captionHelp=root.querySelector('[data-caption-help]');
    const labelView=root.querySelector('.label'),captionView=root.querySelector('.caption');
    const plus=root.querySelector('.plus'),pill=root.querySelector('[data-pill]'),outlinerCaption=root.querySelector('[data-outliner-caption]');
    let caption='';
    function refresh(){
      const label=choice.value;
      root.querySelector('[data-result]').hidden=!label;
      labelView.textContent=label;labelView.hidden=!label;
      pill.textContent=label;pill.hidden=!label;
      if(label){labelView.style.color=labelColor.value;pill.style.backgroundColor=labelColor.value+'22';pill.style.color=labelColor.value;}
      captionView.textContent=caption;captionView.hidden=!caption;
      outlinerCaption.textContent=caption;outlinerCaption.hidden=!caption;
      plus.hidden=!!caption||!captionInput.hidden;
    }
    root.querySelectorAll('[data-action]').forEach(button=>button.addEventListener('click',()=>{
      if(button.dataset.action==='label'){
        scrim.hidden=false;status.textContent='Alt+L · 기존 라벨 창이 열렸습니다. 기존 라벨을 고르거나 새 라벨을 추가하세요.';
        choice.focus();
      }else{
        scrim.hidden=true;captionInput.hidden=false;captionHelp.hidden=false;plus.hidden=true;captionInput.value=caption;captionInput.focus();
        status.textContent='Alt+C · 카드 바로 아래에서 캡션을 입력합니다.';
      }
    }));
    root.querySelector('[data-add]').addEventListener('click',()=>{
      const value=labelText.value.trim();if(!value)return;
      if(![...choice.options].some(o=>o.value===value)){const option=new Option(value,value);choice.add(option);}
      choice.value=value;labelText.value='';status.textContent='새 라벨을 선택했습니다. 적용을 누르면 Canvas와 Outliner에 표시됩니다.';
    });
    root.querySelector('[data-apply]').addEventListener('click',()=>{scrim.hidden=true;refresh();status.textContent='라벨을 Canvas 카드에 적용했습니다. Outliner에도 표시됩니다.';});
    choice.addEventListener('change',()=>{if(!scrim.hidden){refresh();status.textContent='선택한 라벨은 적용을 눌러 반영합니다.';}});
    plus.addEventListener('click',()=>{captionInput.hidden=false;captionHelp.hidden=false;plus.hidden=true;captionInput.focus();});
    captionInput.addEventListener('keydown',event=>{
      event.stopPropagation();if(event.isComposing||event.keyCode===229)return;
      if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();caption=captionInput.value.trim();captionInput.hidden=true;captionHelp.hidden=true;refresh();status.textContent='캡션을 카드 아래에 저장했습니다. Outliner에서 확인할 수 있습니다.';}
      if(event.key==='Escape'){event.preventDefault();captionInput.value=caption;captionInput.hidden=true;captionHelp.hidden=true;refresh();status.textContent='캡션 입력을 취소했습니다.';}
    });
    captionInput.addEventListener('blur',()=>{if(captionInput.hidden)return;caption=captionInput.value.trim();captionInput.hidden=true;captionHelp.hidden=true;refresh();});
    root.querySelector('.search').addEventListener('input',event=>{
      const query=event.target.value.trim().toLocaleLowerCase();const label=choice.value.toLocaleLowerCase();
      root.querySelector('[data-result]').hidden=!!query&&!('작업 공간 아이디어 '+label).includes(query);
    });
    root.addEventListener('keydown',event=>{
      if(event.isComposing||event.repeat||!event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;
      if(event.code==='KeyL'){event.preventDefault();dialog.hidden=false;scrim.hidden=false;choice.focus();status.textContent='Alt+L · 기존 라벨 창을 열었습니다.';}
      if(event.code==='KeyC'){event.preventDefault();scrim.hidden=true;captionInput.hidden=false;captionHelp.hidden=false;plus.hidden=true;captionInput.focus();}
    });
    refresh();
  })();
  </script>
</div>
